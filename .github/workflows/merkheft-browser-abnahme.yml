name: Mathe-Merkheft Browser-Abnahme (Entwicklungszweig)
on:
  push:
    branches:
      - gesamtumbau-erklaerstandard-2026-11-04
  workflow_dispatch:
jobs:
  browser-und-struktur:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Struktur- und Fachaudit
        run: node tests/erklaerstandard-audit.cjs
      - name: Playwright installieren
        run: |
          npm install --no-save @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Lokalen Server starten
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/merkheft-server.log 2>&1 & echo $! > /tmp/merkheft-server.pid
      - name: Browserabnahme Desktop und Smartphone
        run: npx playwright test tests/merkheft-browser.spec.js --workers=2 --timeout=90000 --reporter=line
      - name: Ergebnisse und Screenshots archivieren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merkheft-browser-abnahme
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
