name: Mathe Merkheft - Vollpruefung
on:
  push:
    branches: [gesamtumbau-erklaerstandard-2026-11-04]
  workflow_dispatch:
jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static source and math structure
        run: node tests/erklaerstandard-audit.cjs
      - name: Browser dependencies
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/merkheft-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/brueche.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Browser full traversal and nine tools
        run: npx playwright test tests/merkheft-browser.spec.cjs tests/merkheft-vollstaendig.spec.cjs --browser chromium --workers 2 --reporter line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merkheft-qa-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
